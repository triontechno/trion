[package]
name = "trion-binary-translator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "x86-64 ELF inspection front-end for Trion's binary-to-ternary translator"

[[bin]]
name = "trion-translate"
path = "src/main.rs"

[dependencies]
goblin = "0.9"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
