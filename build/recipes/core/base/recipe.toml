[source]
path = "../src/base"

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
script = """
# The vendored base tree is copied into the recipe source directory. Rebase
# its TRION platform-crate path dependency to the monorepo's ternary workspace.
sed -i 's|path = "../../../ternary/platform"|path = "../../../../../../ternary/platform"|' \
    "${COOKBOOK_SOURCE}/trion-capd/Cargo.toml"

cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""
