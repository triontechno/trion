name: SimpleBuild Prerequisite Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "Cargo.lock"
      - ".github/workflows/simplebuild.yml"
  push:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "Cargo.lock"
      - ".github/workflows/simplebuild.yml"

permissions:
  contents: read

concurrency:
  group: simplebuild-prerequisites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prerequisites:
    name: Prepare and save the tools needed to build TRION
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the build environment
        run: |
          bash simplebuild/ci-status.sh --success 'Complete: Build environment is ready.' -- bash -c 'sudo apt-get update && sudo apt-get install --yes podman'

      - name: Prepare storage for saved build files
        run: mkdir -p dist

      # Use explicit restore/save actions: the save step below runs even when
      # compilation or validation fails, preserving whatever was completed.
      - name: Calculate prerequisite source fingerprint
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(
            git ls-files -z -- build/mk build/podman build/code build/recipes build/Cargo.toml build/Cargo.lock build/UPSTREAM.lock |
              sort -z |
              xargs -0 -r sha256sum |
              sha256sum |
              cut -d ' ' -f 1
          )"
          echo "hash=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Reuse previously completed build work
        uses: actions/cache/restore@v4
        with:
          path: |
            build/prefix
            build/target
            build/recipes/**/target
            build/build
            dist/redox-base.oci
          key: simplebuild-prerequisites-${{ runner.os }}-x86_64-desktop-${{ steps.cache-key.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            simplebuild-prerequisites-${{ runner.os }}-x86_64-desktop-${{ steps.cache-key.outputs.hash }}-

      - name: Reuse the saved build environment
        run: |
          if [[ -s dist/redox-base.oci ]]; then
            podman load --input dist/redox-base.oci >/dev/null 2>&1
            echo "Complete: Reused the saved build environment."
          else
            echo "WARNING: No saved build environment was found; a fresh one will be prepared if needed."
          fi

      - name: Check that the required build steps are available
        run: |
          bash simplebuild/ci-status.sh --success 'Complete: All required build steps are available.' -- bash simplebuild/prepare-prerequisites.sh --dry-run

      - name: Build and save the tools TRION needs
        env:
          CI: "1"
          COOKBOOK_MAKE_JOBS: "2"
        run: |
          bash simplebuild/ci-status.sh --success 'Complete: Built and checked the tools TRION needs.' -- bash simplebuild/prepare-prerequisites.sh

      - name: Check the build instructions
        run: |
          bash simplebuild/ci-status.sh --success 'Complete: Build instructions and checks passed.' -- bash simplebuild/test.sh

      # This runs after success OR failure. It snapshots all extant build
      # outputs, including .partial directories left by an interrupted build.
      - name: Save all completed build work
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          paths_file=dist/prerequisite-paths.txt
          : > "$paths_file"

          for path in build/prefix build/target build/build; do
            if [[ -e "$path" ]]; then
              printf '%s\n' "$path" >> "$paths_file"
            fi
          done

          if [[ -d build/recipes ]]; then
            find build/recipes -type d -name target -prune -print >> "$paths_file"
          fi

          if [[ -s "$paths_file" ]]; then
            tar --create --gzip --file dist/simplebuild-prerequisites.tar.gz --files-from="$paths_file" >/dev/null 2>&1
          else
            printf 'No compiled prerequisite directories were present.\n' > dist/NO_BUILD_OUTPUTS.txt
          fi

          if podman image exists redox-base; then
            podman save --format oci-archive --output dist/redox-base.oci redox-base >/dev/null 2>&1
          fi

          {
            printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$COMMIT_SHA" "$RUN_ID" "$RUN_ATTEMPT"
            printf 'Captured paths:\n'
            cat "$paths_file"
          } > dist/BUILD-SNAPSHOT.txt

          checksum_files=()
          for file in dist/simplebuild-prerequisites.tar.gz dist/redox-base.oci; do
            if [[ -s "$file" ]]; then checksum_files+=("$file"); fi
          done
          if (( ${#checksum_files[@]} > 0 )); then
            sha256sum "${checksum_files[@]}" > dist/SHA256SUMS
          fi
          echo "Complete: Saved all build work that was available."

      - name: Store the completed build work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebuild-prerequisites-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/simplebuild-prerequisites.tar.gz
            dist/redox-base.oci
            dist/SHA256SUMS
            dist/BUILD-SNAPSHOT.txt
            dist/prerequisite-paths.txt
            dist/NO_BUILD_OUTPUTS.txt
          if-no-files-found: warn
          retention-days: 30

      # Cache entries are immutable, so each run/attempt gets its own key.
      # The next run restores the newest compatible snapshot via restore-keys.
      - name: Keep completed work for the next build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build/prefix
            build/target
            build/recipes/**/target
            build/build
            dist/redox-base.oci
          key: simplebuild-prerequisites-${{ runner.os }}-x86_64-desktop-${{ steps.cache-key.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}

      # PRs must prove they can generate the actual desktop ISO, not merely
      # pass CLI/configuration checks. Main-branch ISO builds use the dedicated
      # artifact-restoring workflow to avoid doing this work twice.
      - name: Build and check the TRION desktop ISO
        if: github.event_name == 'pull_request'
        env:
          ARCH: x86_64
          CONFIG_NAME: desktop
          PODMAN_BUILD: "1"
          FSTOOLS_IN_PODMAN: "1"
          PREFIX_BINARY: "0"
          PREFIX_USE_UPSTREAM_RUST_COMPILER: "1"
          CI: "1"
          COOKBOOK_MAKE_JOBS: "2"
        run: |
          bash simplebuild/ci-status.sh --success 'Complete: Built and checked the TRION desktop ISO.' -- bash simplebuild/build.sh --arch x86_64 --config desktop

      - name: Store the finished TRION desktop ISO
        if: always() && github.event_name == 'pull_request' && hashFiles('build/build/x86_64/desktop/redox-live.iso') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trion-os-pr-iso-${{ github.sha }}
          path: |
            build/build/x86_64/desktop/redox-live.iso
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
