name: SimpleBuild Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main, simplebuild/remove-legacy]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "mds/**"
      - ".github/workflows/simplebuild.yml"
  push:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "mds/**"
      - ".github/workflows/simplebuild.yml"

permissions:
  contents: read

concurrency:
  group: simplebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SimpleBuild CLI and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate SimpleBuild scripts and configuration
        run: bash simplebuild/test.sh
