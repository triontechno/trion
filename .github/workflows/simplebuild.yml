name: SimpleBuild Prerequisite Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "recipes/**"
      - "src/**"
      - "ternary/**"
      - "Cargo.lock"
      - ".github/workflows/simplebuild.yml"
  push:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "recipes/**"
      - "src/**"
      - "ternary/**"
      - "Cargo.lock"
      - ".github/workflows/simplebuild.yml"

permissions:
  contents: read

concurrency:
  group: simplebuild-prerequisites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prerequisites:
    name: Build, cache, and validate prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Prepare cache directory
        run: mkdir -p dist

      - name: Restore compiled prerequisite cache
        uses: actions/cache@v4
        with:
          path: |
            build/prefix
            build/target
            build/recipes/**/target
            build/fstools
            build/fstools.tag
            build/container.tag
            build/podman
            dist/redox-base.oci
          key: simplebuild-prerequisites-${{ runner.os }}-x86_64-desktop-${{ hashFiles('build/mk/**', 'build/podman/**', 'recipes/dev/**', 'recipes/libs/**', 'recipes/core/relibc/**', 'Cargo.lock') }}

      - name: Restore cached Podman build image
        run: |
          if [[ -s dist/redox-base.oci ]]; then
            podman load --input dist/redox-base.oci
          fi

      - name: Build GCC, Rust, and host filesystem tools from binary prefixes
        env:
          CI: "1"
        run: |
          make -C build \
            ARCH=x86_64 \
            CONFIG_NAME=desktop \
            PREFIX_BINARY=1 \
            PODMAN_BUILD=1 \
            FSTOOLS_IN_PODMAN=1 \
            gcc-install rust-install fstools

      - name: Build Clang/LLVM from source
        env:
          CI: "1"
        run: |
          # The upstream prebuilt clang-install.tar.gz endpoint returned HTTP 403
          # in GitHub Actions. Build this one prefix through the canonical
          # Cookbook recipes instead of repeatedly downloading the blocked file.
          make -C build \
            ARCH=x86_64 \
            CONFIG_NAME=desktop \
            PREFIX_BINARY=0 \
            PODMAN_BUILD=1 \
            FSTOOLS_IN_PODMAN=1 \
            clang-install

      - name: Assemble relibc sysroot with the prepared prefixes
        env:
          CI: "1"
        run: |
          make -C build \
            ARCH=x86_64 \
            CONFIG_NAME=desktop \
            PREFIX_BINARY=1 \
            PODMAN_BUILD=1 \
            FSTOOLS_IN_PODMAN=1 \
            prefix

      - name: Verify prerequisite outputs
        run: |
          set -euo pipefail
          prefix="build/prefix/x86_64-unknown-redox"
          for output in gcc-install rust-install clang-install sysroot; do
            test -d "$prefix/$output"
            test -n "$(find "$prefix/$output" -mindepth 1 -print -quit)"
          done
          test -x build/target/release/repo
          test -x build/fstools/bin/redox_installer
          test -x build/fstools/bin/redoxfs
          test -x build/fstools/bin/redoxfs-mkfs
          echo "Compiler prefixes, relibc sysroot, Cookbook, installer, and filesystem tools are ready."

      - name: Run SimpleBuild CLI and regression validation
        run: bash simplebuild/test.sh

      - name: Package prerequisites for the dedicated ISO workflow
        run: |
          set -euo pipefail
          mkdir -p dist
          paths=(build/prefix build/target build/recipes build/podman)
          for path in build/fstools build/fstools.tag build/container.tag; do
            if [[ -e "$path" ]]; then paths+=("$path"); fi
          done
          tar -czf dist/simplebuild-prerequisites.tar.gz "${paths[@]}"
          podman save --format oci-archive --output dist/redox-base.oci redox-base
          test -s dist/simplebuild-prerequisites.tar.gz
          test -s dist/redox-base.oci
          sha256sum dist/simplebuild-prerequisites.tar.gz dist/redox-base.oci > dist/SHA256SUMS

      - name: Upload reusable prerequisites
        uses: actions/upload-artifact@v4
        with:
          name: simplebuild-prerequisites-${{ github.sha }}
          path: |
            dist/simplebuild-prerequisites.tar.gz
            dist/redox-base.oci
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
