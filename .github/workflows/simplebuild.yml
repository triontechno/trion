name: SimpleBuild Prerequisite Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "Cargo.lock"
      - ".github/workflows/simplebuild.yml"
  push:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "Cargo.lock"
      - ".github/workflows/simplebuild.yml"

permissions:
  contents: read

concurrency:
  group: simplebuild-prerequisites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prerequisites:
    name: Build, cache, and validate prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Prepare cache directory
        run: mkdir -p dist

      - name: Restore compiled prerequisite cache
        uses: actions/cache@v4
        with:
          path: |
            build/prefix
            build/target
            build/recipes/**/target
            build/build/fstools
            build/build/fstools.tag
            build/build/container.tag
            build/build/podman
            dist/redox-base.oci
          key: simplebuild-prerequisites-${{ runner.os }}-x86_64-desktop-${{ hashFiles('build/mk/**', 'build/podman/**', 'build/code/**', 'build/recipes/dev/**', 'build/recipes/libs/**', 'build/recipes/core/relibc/**', 'build/recipes/core/installer/**', 'build/recipes/core/redoxfs/**', 'build/Cargo.toml', 'build/Cargo.lock', 'build/UPSTREAM.lock') }}

      - name: Restore cached Podman build image
        run: |
          if [[ -s dist/redox-base.oci ]]; then
            podman load --input dist/redox-base.oci
          fi

      - name: Build, cache, and validate all prerequisites
        env:
          CI: "1"
          COOKBOOK_MAKE_JOBS: "2"
        run: |
          # Keep the fast, published GCC and Rust prefixes. Build only Clang/LLVM
          # from the checked-out Cookbook recipes because the published Clang
          # archive currently returns HTTP 403 from static.redox-os.org.
          make -C build \
            ARCH=x86_64 \
            CONFIG_NAME=desktop \
            PREFIX_BINARY=1 \
            PREFIX_CLANG_BINARY=0 \
            PODMAN_BUILD=1 \
            FSTOOLS_IN_PODMAN=1 \
            prefix fstools

      - name: Verify prerequisite outputs
        run: |
          set -euo pipefail
          prefix="build/prefix/x86_64-unknown-redox"
          for output in gcc-install rust-install clang-install sysroot; do
            test -d "$prefix/$output"
            test -n "$(find "$prefix/$output" -mindepth 1 -print -quit)"
          done
          test -x build/target/release/repo
          test -s build/build/fstools.tag
          test -s build/build/container.tag
          test -x build/build/fstools/bin/redox_installer
          test -x build/build/fstools/bin/redoxfs
          test -x build/build/fstools/bin/redoxfs-mkfs
          echo "Compiler prefixes, relibc sysroot, Cookbook, installer, and filesystem tools are ready."

      - name: Run SimpleBuild CLI and regression validation
        run: bash simplebuild/test.sh

      - name: Package prerequisites for the dedicated ISO workflow
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            printf '%s\0' \
              build/prefix \
              build/target \
              build/build/fstools \
              build/build/fstools.tag \
              build/build/container.tag \
              build/build/podman
            find build/recipes -type d -name target -prune -print0
          } | tar --create --gzip --file dist/simplebuild-prerequisites.tar.gz --null --files-from=-
          podman save --format oci-archive --output dist/redox-base.oci redox-base
          test -s dist/simplebuild-prerequisites.tar.gz
          test -s dist/redox-base.oci
          sha256sum dist/simplebuild-prerequisites.tar.gz dist/redox-base.oci > dist/SHA256SUMS

      - name: Upload reusable prerequisites
        uses: actions/upload-artifact@v4
        with:
          name: simplebuild-prerequisites-${{ github.sha }}
          path: |
            dist/simplebuild-prerequisites.tar.gz
            dist/redox-base.oci
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
