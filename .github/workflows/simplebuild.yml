name: SimpleBuild Image Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main, simplebuild/remove-legacy]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "mds/**"
      - ".github/workflows/simplebuild.yml"
  push:
    branches: [main]
    paths:
      - "simplebuild/**"
      - "build/**"
      - "src/**"
      - "ternary/**"
      - "mds/**"
      - ".github/workflows/simplebuild.yml"

permissions:
  contents: read

concurrency:
  group: simplebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SimpleBuild CLI and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate SimpleBuild scripts and configuration
        run: bash simplebuild/test.sh

  build-images:
    name: Build and verify desktop images
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash build/podman_bootstrap.sh -d
      - name: Configure canonical build backend
        run: printf 'PODMAN_BUILD?=1\n' > build/.config
      - name: Build disk image and live ISO
        run: bash simplebuild/build.sh --arch x86_64 --config desktop
      - name: Verify generated artifacts
        run: |
          set -euo pipefail
          cd build/build/x86_64/desktop
          test -s harddrive.img
          test -s redox-live.iso
          sha256sum --check SHA256SUMS
      - name: Upload verified images
        uses: actions/upload-artifact@v4
        with:
          name: trion-images
          path: |
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/redox-live.iso
            build/build/x86_64/desktop/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
