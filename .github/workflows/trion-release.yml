name: TRION Image Build

on:
  push:
    branches:
      - main
      - triontechno-complete-stage-h-i
    paths:
      - "simplebuild/**"
      - "ternary/**"
      - "src/**"
      - "build/**"
      - "config/**"
      - "kernel/**"
      - "filesystem/**"
      - "podman/**"
      - "recipes/**"
      - "cookbook.toml"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trion-image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build TRION IMG and ISO with SimpleBuild
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore checksum-verified SimpleBuild prerequisites
        id: prerequisites-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/build/podman
            build/prefix
            build/repo
            build/fstools
            build/fstools-target
            build/fstools.tag
            build/target
            build/recipes/**/target
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          key: simplebuild-prerequisites-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'Cargo.lock', '**/Cargo.lock') }}

      - name: Verify exact prerequisite cache and checksums
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.prerequisites-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "::error::No exact prerequisite cache for the current build inputs."
            echo "Run Actions → Prepare SimpleBuild Prerequisites on main once, then retry this workflow."
            exit 1
          fi
          test -x build/fstools/bin/redox_installer
          test -d build/repo
          test -s build/simplebuild/cache/repo_archive.tar.gz
          test -s build/simplebuild/prerequisites.sha256
          (cd build && sha256sum -c simplebuild/prerequisites.sha256)
          tar -tzf build/simplebuild/cache/repo_archive.tar.gz >/dev/null

      - name: Install image-build runtime dependencies
        shell: bash
        run: bash build/podman_bootstrap.sh -d

      - name: Install QEMU and UEFI firmware
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Validate SimpleBuild scripts
        shell: bash
        run: |
          bash -n simplebuild/build.sh
          bash -n simplebuild/qemu-test.sh
          python3 -m py_compile simplebuild/build.py

      - name: Check SimpleBuild prerequisites
        shell: bash
        run: bash simplebuild/build.sh --arch x86_64 --config desktop --check

      - name: Generate both release images with SimpleBuild
        id: simplebuild
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          bash simplebuild/build.sh --arch x86_64 --config desktop --no-rebuild-changed --force
          elapsed=$((SECONDS - started))
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          {
            echo "### Fresh TRION release image-generation timing"
            echo
            echo "- Duration: ${elapsed}s ($((elapsed / 60))m $((elapsed % 60))s)"
            if (( elapsed <= 1800 )); then
              echo "- 30-minute target: **MET**"
            else
              echo "- 30-minute target: **NOT MET** (over by $((elapsed - 1800))s)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify build outputs and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/build/x86_64/desktop
          test -s harddrive.img
          test -s redox-live.iso
          sha256sum -c SHA256SUMS

      - name: Boot-test both release images directly in QEMU
        shell: bash
        run: |
          set -euo pipefail
          bash simplebuild/qemu-test.sh \\
            build/build/x86_64/desktop/harddrive.img \\
            build/build/x86_64/desktop/redox-live.iso

      - name: Upload build artifacts for release
        uses: actions/upload-artifact@v4
        with:
          name: trion-images
          path: |
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/redox-live.iso
            build/build/x86_64/desktop/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
