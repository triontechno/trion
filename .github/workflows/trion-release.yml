name: TRION Build and Release

on:
  push:
    branches:
      - triontechno-complete-stage-h-i
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after image and QEMU validation"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trion-release-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  # Change 1.0 to 2.0 when starting the next version series.
  VERSION_PREFIX: "1.0"

jobs:
  build:
    name: Build TRION images
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Preserve the expensive Redox cross-toolchain and package build outputs
      # between runs. The cache key changes when core build definitions change.
      - name: Restore Redox toolchain and build cache
        uses: actions/cache@v4
        with:
          path: |
            prefix/x86_64-unknown-redox
            recipes/**/target
            build/fstools
            build/fstools.tag
            build/podman
            ~/.cargo/registry
            ~/.cargo/git
          key: trion-redox-${{ runner.os }}-x86_64-${{ hashFiles('build/mk/*.mk', 'podman/redox-base-containerfile', 'cookbook.toml') }}
          restore-keys: |
            trion-redox-${{ runner.os }}-x86_64-

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        shell: bash
        run: |
          bash build/podman_bootstrap.sh -d

      - name: Configure Podman build
        shell: bash
        run: |
          cat > build/.config <<'EOF'
          PODMAN_BUILD?=1
          # The Redox prebuilt toolchain host is returning HTTP 403 in CI.
          # Build the cross-toolchain from source instead; use upstream Rust
          # binaries to avoid compiling the Rust compiler itself.
          PREFIX_BINARY=0
          PREFIX_USE_UPSTREAM_RUST_COMPILER=1
          EOF

      - name: Build desktop disk image and live ISO
        shell: bash
        run: |
          set -euo pipefail
          bash build/build-images.sh

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/build/x86_64/desktop/harddrive.img
          test -s build/build/x86_64/desktop/redox-live.iso

      - name: Smoke-test x86_64 kernel entry in QEMU
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            make -C build qemu gpu=no kvm=no uefi=no net=no audio=no usb=no serial=yes \
            >"$log" 2>&1
          qemu_status=$?
          set -e
          if ! grep -Fq 'Redox OS starting...' "$log"; then
            cat "$log"
            echo "QEMU did not reach x86_64 kernel entry within 120 seconds."
            exit 1
          fi
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            cat "$log"
            exit "$qemu_status"
          fi
          if ! grep -Fq "capability scheme registered at /scheme/trion" "$log"; then
            cat "$log"
            echo "QEMU did not observe the TRION capability service becoming ready."
            exit 1
          fi
          if ! grep -Fq "capability reports validated from /scheme/trion" "$log"; then
            cat "$log"
            echo "QEMU did not validate all capability endpoints from user space."
            exit 1
          fi
          echo "QEMU validated kernel entry, capability service readiness, and user-space report reads."

      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          name: TRION v${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/redox-live.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
