name: TRION Image Build

on:
  push:
    branches: [main]
    paths:
      - "ternary/**"
      - "src/**"
      - "build/**"
      - "config/**"
      - "kernel/**"
      - "filesystem/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trion-image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build TRION IMG and ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache image-build toolchain and recipe outputs
        uses: actions/cache@v4
        with:
          path: |
            build/build/podman
            build/prefix
            build/repo
            build/recipes/**/target
          key: trion-images-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            trion-images-${{ runner.os }}-

      - name: Install build dependencies
        shell: bash
        run: bash build/podman_bootstrap.sh -d

      - name: Configure Podman build
        shell: bash
        run: printf 'PODMAN_BUILD?=1\nPREFIX_BINARY=0\n' > build/.config

      - name: Build desktop disk image and live ISO
        shell: bash
        run: |
          set -euo pipefail
          make -C build all
          make -C build live

      - name: Diagnose cross-compilation configure failures
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          found=0
          while IFS= read -r -d '' log; do
            found=1
            echo "::group::Compiler configure log: $log"
            if ! grep -n -E 'cannot create executables|fatal error:|undefined reference|cannot find|collect2:|ld returned|configure: error' "$log" | tail -n 80; then
              tail -n 80 "$log"
            fi
            echo "::endgroup::"
          done < <(find build/recipes -type f -name config.log -print0 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo "No Autoconf config.log files were retained."
          fi

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/build/x86_64/desktop/harddrive.img
          test -s build/build/x86_64/desktop/redox-live.iso

      - name: Smoke-test x86_64 kernel entry in QEMU
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            make -C build qemu gpu=no kvm=no uefi=no net=no audio=no usb=no serial=yes \
            >"$log" 2>&1
          qemu_status=$?
          set -e
          if ! grep -Fq 'Redox OS starting...' "$log"; then
            cat "$log"
            echo "QEMU did not reach x86_64 kernel entry within 120 seconds."
            exit 1
          fi
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            cat "$log"
            exit "$qemu_status"
          fi
          if ! grep -Fq "capability scheme registered at /scheme/trion" "$log"; then
            cat "$log"
            echo "QEMU did not observe the TRION capability service becoming ready."
            exit 1
          fi
          if ! grep -Fq "capability reports validated from /scheme/trion" "$log"; then
            cat "$log"
            echo "QEMU did not validate all capability endpoints from user space."
            exit 1
          fi
          echo "QEMU validated kernel entry, capability service readiness, and user-space report reads."

      - name: Upload build artifacts for release
        uses: actions/upload-artifact@v4
        with:
          name: trion-images
          path: |
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/redox-live.iso
          if-no-files-found: error
          retention-days: 30
