name: TRION Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trion-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Change 1.0 to 2.0 when starting the next version series.
  VERSION_PREFIX: "1.0"

jobs:
  build:
    name: Build TRION images
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        shell: bash
        run: |
          bash build/podman_bootstrap.sh -d

      - name: Configure Podman build
        shell: bash
        run: |
          printf 'PODMAN_BUILD?=1\n' > build/.config

      - name: Build desktop disk image and live ISO
        shell: bash
        run: |
          set -euo pipefail
          make -C build all
          make -C build live

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/build/x86_64/desktop/harddrive.img
          test -s build/build/x86_64/desktop/redox-live.iso

      - name: Smoke-test x86_64 kernel entry in QEMU
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            make -C build qemu gpu=no kvm=no uefi=no net=no audio=no usb=no serial=yes \
            >"$log" 2>&1
          qemu_status=$?
          set -e
          if ! grep -Fq 'Redox OS starting...' "$log"; then
            cat "$log"
            echo "QEMU did not reach x86_64 kernel entry within 120 seconds."
            exit 1
          fi
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            cat "$log"
            exit "$qemu_status"
          fi
          echo "QEMU reached x86_64 kernel entry."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          name: TRION v${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/redox-live.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
