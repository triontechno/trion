name: SimpleBuild checks

on:
  push:
    branches:
      - "simplebuild/**"

jobs:
  syntax-and-config-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check SimpleBuild
        run: python -m py_compile simplebuild/build.py
      - name: Discover configured profiles
        run: |
          python simplebuild/build.py --arch x86_64 --list-configs
          python simplebuild/build.py --arch aarch64 --list-configs
