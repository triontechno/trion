name: Trion ternary core

on:
  push:
    branches: [main]
    paths:
      - "ternary/**"
      - "src/**"
      - "build/**"
      - "config/**"
      - "kernel/**"
      - "filesystem/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "ternary/core/**"
      - ".github/workflows/ternary-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test balanced-ternary library
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ternary/core
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run tests
        run: cargo test --all-targets
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
