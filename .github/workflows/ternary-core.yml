name: Trion ternary core

on:
  push:
    branches:
      - feat/ternary-core
    paths:
      - "ternary/**"
      - ".github/workflows/ternary-core.yml"
  pull_request:
    branches:
      - master
    paths:
      - "ternary/**"
      - ".github/workflows/ternary-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test balanced-ternary library
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ternary
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run formatting check
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
