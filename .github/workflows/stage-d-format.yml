name: Stage D rustfmt helper

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'phase2-stage-d-full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Stage D Rust crates
        run: |
          cargo fmt --manifest-path ternary/translator/Cargo.toml --all
          cargo fmt --manifest-path ternary/runtime/Cargo.toml
          cargo fmt --manifest-path ternary/executable/Cargo.toml
      - name: Push formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ternary
          git commit -m "style(stage-d): apply rustfmt"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
