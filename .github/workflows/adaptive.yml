name: TRION adaptive policy
# CI coverage: Stages A-D policy, memory, TIR runtime, TRIONEX, and translator.

on:
  push:
    branches: [main]
    paths:
      - "ternary/adaptive/**"
      - "ternary/memory/**"
      - "ternary/runtime/**"
      - "ternary/executable/**"
      - "ternary/translator/**"
      - "ternary/core/**"
      - ".github/workflows/adaptive.yml"
  pull_request:
    branches: [main]
    paths:
      - "ternary/adaptive/**"
      - "ternary/memory/**"
      - "ternary/runtime/**"
      - "ternary/executable/**"
      - "ternary/translator/**"
      - "ternary/core/**"
      - ".github/workflows/adaptive.yml"
  workflow_dispatch:

jobs:
  adaptive-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test adaptive policy
        run: cargo test --manifest-path ternary/adaptive/Cargo.toml
      - name: Test packed ternary memory
        run: cargo test --manifest-path ternary/memory/Cargo.toml
      - name: Test TIR runtime
        run: cargo test --manifest-path ternary/runtime/Cargo.toml
      - name: Test TRIONEX container
        run: cargo test --manifest-path ternary/executable/Cargo.toml
      - name: Test binary translator
        run: cargo test --manifest-path ternary/translator/Cargo.toml
      - name: Check formatting
        run: |
          cargo fmt --manifest-path ternary/adaptive/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/memory/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/runtime/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/executable/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/translator/Cargo.toml -- --check
      - name: Run clippy
        run: |
          cargo clippy --manifest-path ternary/adaptive/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/memory/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/runtime/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/executable/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/translator/Cargo.toml --all-targets -- -D warnings
