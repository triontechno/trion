name: TRION adaptive policy

on:
  push:
    branches: [phase2-stage-a-adaptive]
    paths:
      - "ternary/adaptive/**"
      - "ternary/core/**"
      - ".github/workflows/adaptive.yml"
  pull_request:
    paths:
      - "ternary/adaptive/**"
      - "ternary/core/**"
      - ".github/workflows/adaptive.yml"
  workflow_dispatch:

jobs:
  adaptive-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test adaptive policy
        run: cargo test --manifest-path ternary/adaptive/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path ternary/adaptive/Cargo.toml -- --check
      - name: Run clippy
        run: cargo clippy --manifest-path ternary/adaptive/Cargo.toml --all-targets -- -D warnings
