name: TRION adaptive policy
# CI coverage: adaptive policy, packed memory, legacy TIR runtime, platform report, and benchmarks.

on:
  push:
    branches: [main]
    paths:
      - "ternary/adaptive/**"
      - "ternary/memory/**"
      - "ternary/runtime/**"
      - "ternary/platform/**"
      - "ternary/benchmarks/**"
      - "ternary/core/**"
      - ".github/workflows/adaptive.yml"
  pull_request:
    branches: [main]
    paths:
      - "ternary/adaptive/**"
      - "ternary/memory/**"
      - "ternary/runtime/**"
      - "ternary/executable/**"
      - "ternary/translator/**"
      - "ternary/core/**"
      - ".github/workflows/adaptive.yml"
  workflow_dispatch:

jobs:
  adaptive-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test adaptive policy
        run: cargo test --manifest-path ternary/adaptive/Cargo.toml
      - name: Test packed ternary memory
        run: cargo test --manifest-path ternary/memory/Cargo.toml
      - name: Test TIR runtime
        run: cargo test --manifest-path ternary/runtime/Cargo.toml
      - name: Test platform capability report
        run: cargo test --manifest-path ternary/platform/Cargo.toml
      - name: Run representation benchmark smoke test
        run: cargo run --manifest-path ternary/benchmarks/Cargo.toml --release
      - name: Check platform capability CLI
        run: cargo run --manifest-path ternary/platform/Cargo.toml
      - name: Check formatting
        run: |
          cargo fmt --manifest-path ternary/adaptive/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/memory/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/runtime/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/platform/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/benchmarks/Cargo.toml -- --check
      - name: Run clippy
        run: |
          cargo clippy --manifest-path ternary/adaptive/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/memory/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/runtime/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/platform/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/benchmarks/Cargo.toml --all-targets -- -D warnings
