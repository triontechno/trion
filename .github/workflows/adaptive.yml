name: TRION adaptive policy
# CI covers adaptive policy, packed memory, TIR research runtime, platform integration,
# and the Redox boot-time capability service.

on:
  workflow_dispatch:

jobs:
  adaptive-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test adaptive policy
        run: cargo test --manifest-path ternary/adaptive/Cargo.toml
      - name: Test packed ternary memory
        run: cargo test --manifest-path ternary/memory/Cargo.toml
      - name: Test TIR research runtime
        run: cargo test --manifest-path ternary/runtime/Cargo.toml
      - name: Test platform capability and adaptive workload
        run: cargo test --manifest-path ternary/platform/Cargo.toml
      - name: Run representation benchmark smoke test
        run: cargo run --manifest-path ternary/benchmarks/Cargo.toml --release
      - name: Check platform capability CLI
        run: cargo run --manifest-path ternary/platform/Cargo.toml
      - name: Check formatting
        run: |
          cargo fmt --manifest-path ternary/adaptive/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/memory/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/runtime/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/platform/Cargo.toml -- --check
          cargo fmt --manifest-path ternary/benchmarks/Cargo.toml -- --check
      - name: Run clippy
        run: |
          cargo clippy --manifest-path ternary/adaptive/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/memory/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/runtime/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/platform/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path ternary/benchmarks/Cargo.toml --all-targets -- -D warnings

  redox-capability-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Test Redox capability scheme
        run: cargo test --manifest-path src/base/Cargo.toml -p trion-capd
      - name: Test boot integration checker
        run: cargo test --manifest-path src/base/Cargo.toml -p trion-cap-check
      - name: Check Redox capability services
        run: cargo check --manifest-path src/base/Cargo.toml -p trion-capd -p trion-cap-check
      - name: Check service formatting
        run: cargo fmt --manifest-path src/base/Cargo.toml -p trion-capd -p trion-cap-check -- --check
      - name: Lint capability services
        run: cargo clippy --manifest-path src/base/Cargo.toml -p trion-capd -p trion-cap-check --all-targets --no-deps -- -D warnings

  packed-memory-fuzz:
    # Intentionally manual: run only in the consolidated post-Phase-2 test pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build packed-memory and TRN3 fuzz targets
        working-directory: ternary/fuzz
        run: cargo fuzz build
      - name: Fuzz packed ternary memory
        working-directory: ternary/fuzz
        run: cargo fuzz run packed_trit_buffer -- -max_total_time=60 -max_len=1048584
      - name: Fuzz TRN3 deserialization
        working-directory: ternary/fuzz
        run: cargo fuzz run trn3_deserialize -- -max_total_time=60 -max_len=1048576
