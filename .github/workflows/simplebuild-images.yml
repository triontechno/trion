name: SimpleBuild OS Images

on:
  workflow_dispatch:
  push:
    branches:
      - simplebuild/pipeline-30m
    paths:
      - "simplebuild/**"
      - "build/**"
      - "config/**"
      - "filesystem/**"
      - "kernel/**"
      - "src/**"
      - ".github/workflows/simplebuild-images.yml"

permissions:
  contents: read

concurrency:
  group: simplebuild-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build both images with SimpleBuild
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore reusable compiled prerequisites and prior images
        uses: actions/cache/restore@v4
        with:
          path: |
            build/build/podman
            build/prefix
            build/repo
            build/fstools
            build/fstools-target
            build/fstools.tag
            build/target
            build/recipes/**/target
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          key: simplebuild-prerequisites-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'simplebuild/**', 'Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            simplebuild-prerequisites-${{ runner.os }}-
            phase2-images-${{ runner.os }}-

      - name: Restore previously generated SimpleBuild images
        uses: actions/cache/restore@v4
        with:
          path: |
            build/build/x86_64/desktop
            build/simplebuild/cache/x86_64
          key: simplebuild-images-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'simplebuild/**', 'Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            simplebuild-images-${{ runner.os }}-

      - name: Install image-build dependencies
        shell: bash
        run: bash build/podman_bootstrap.sh -d

      - name: Configure host-side SimpleBuild
        shell: bash
        run: printf 'PODMAN_BUILD?=1\nPREFIX_BINARY=0\n' > build/.config

      - name: Verify cached prerequisite checksums
        shell: bash
        run: |
          set -euo pipefail
          test -x build/fstools/bin/redox_installer
          test -d build/repo
          test -s build/simplebuild/cache/repo_archive.tar.gz
          test -s build/simplebuild/prerequisites.sha256
          (cd build && sha256sum -c simplebuild/prerequisites.sha256)
          tar -dzf build/simplebuild/cache/repo_archive.tar.gz -C build/repo

      - name: Check SimpleBuild prerequisites
        shell: bash
        run: bash simplebuild/build.sh --arch x86_64 --config desktop --check

      - name: Generate harddrive.img and redox-live.iso with SimpleBuild
        id: simplebuild
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          bash simplebuild/build.sh --arch x86_64 --config desktop
          elapsed=$((SECONDS - started))
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "SimpleBuild elapsed seconds: $elapsed"
          if (( elapsed > 1800 )); then
            echo "::warning::The 30-minute target was exceeded: ${elapsed}s"
          fi

      - name: Verify generated image checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/build/x86_64/desktop
          test -s harddrive.img
          test -s redox-live.iso
          sha256sum -c SHA256SUMS

      - name: Validate OS boot and TRION capability endpoints in QEMU
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            make -C build qemu gpu=no kvm=no uefi=no net=no audio=no usb=no serial=yes \
            >"$log" 2>&1
          qemu_status=$?
          set -e
          grep -Fq 'Redox OS starting...' "$log" || { cat "$log"; exit 1; }
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ]; then
            cat "$log"; exit "$qemu_status"
          fi
          grep -Fq 'capability scheme registered at /scheme/trion' "$log" || { cat "$log"; exit 1; }
          grep -Fq 'capability reports validated from /scheme/trion' "$log" || { cat "$log"; exit 1; }

      - name: Save generated images for subsequent runs
        uses: actions/cache/save@v4
        with:
          path: |
            build/build/x86_64/desktop
            build/simplebuild/cache/x86_64
          key: simplebuild-images-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'simplebuild/**', 'Cargo.lock', '**/Cargo.lock') }}

      - name: Upload SimpleBuild image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trion-simplebuild-x86_64-desktop
          path: |
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/redox-live.iso
            build/build/x86_64/desktop/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
