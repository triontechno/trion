name: SimpleBuild OS Images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "simplebuild/**"
      - "build/**"
      - "config/**"
      - "filesystem/**"
      - "kernel/**"
      - "src/**"
      - ".github/workflows/simplebuild-images.yml"
  push:
    branches:
      - main
    paths:
      - "simplebuild/**"
      - "build/**"
      - "config/**"
      - "filesystem/**"
      - "kernel/**"
      - "src/**"
      - ".github/workflows/simplebuild-images.yml"

permissions:
  contents: read

concurrency:
  group: simplebuild-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-zlib-source:
    name: Verify zlib 1.3 download and BLAKE3 checksum
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust and BLAKE3 verifier
        uses: dtolnay/rust-toolchain@stable

      - name: Install b3sum
        run: cargo install b3sum --locked

      - name: Download and verify the exact zlib 1.3 release archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/madler/zlib/releases/download/v1.3/zlib-1.3.tar.gz"
          archive="zlib-1.3.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --output "$archive" "$url"
          test "$(stat -c '%s' "$archive")" -eq 1495873
          file "$archive"
          tar -tzf "$archive" | grep -q '^zlib-1.3/'
          expected_sha256="ff0ba4c292013dbc27530b3a81e1f9a813cd39de01ca5e0f8bf355702efa593e"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check
          expected_blake3="$(sed -n 's/^blake3 = "\([0-9a-f]*\)"/\1/p' build/recipes/libs/zlib/recipe.toml)"
          test -n "$expected_blake3"
          printf '%s  %s\n' "$expected_blake3" "$archive" | b3sum --check
          echo "zlib 1.3 download, archive structure, SHA-256 and recipe BLAKE3 all verified."

  build-images:
    name: Build both images with SimpleBuild
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute stable prerequisite cache key
        id: prerequisite-key
        shell: bash
        run: bash simplebuild/prerequisite-key.sh

      - name: Restore reusable compiled prerequisites and prior images
        id: prerequisites-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/build/podman
            build/prefix
            build/repo
            build/fstools
            build/fstools-target
            build/fstools.tag
            build/target
            build/recipes/**/target
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          key: ${{ steps.prerequisite-key.outputs.key }}

      - name: Restore previously generated SimpleBuild images
        uses: actions/cache/restore@v4
        with:
          path: |
            build/build/x86_64/desktop
            build/simplebuild/cache/x86_64
          key: simplebuild-images-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'simplebuild/**', 'Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            simplebuild-images-${{ runner.os }}-

      - name: Verify cached prerequisite checksums
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.prerequisites-cache.outputs.cache-hit }}" != "true" ]]; then
            echo "::error::No exact prerequisite cache for the current build inputs."
            echo "Run Actions → Prepare SimpleBuild Prerequisites on main once, then retry this workflow."
            exit 1
          fi
          test -x build/fstools/bin/redox_installer
          test -d build/repo
          test -s build/simplebuild/cache/repo_archive.tar.gz
          test -s build/simplebuild/prerequisites.sha256
          (cd build && sha256sum -c simplebuild/prerequisites.sha256)
          tar -tzf build/simplebuild/cache/repo_archive.tar.gz >/dev/null

      - name: Install image-build dependencies
        shell: bash
        run: bash build/podman_bootstrap.sh -d

      - name: Install QEMU runner
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Validate SimpleBuild scripts
        shell: bash
        run: |
          bash -n simplebuild/build.sh
          bash -n simplebuild/prerequisite-key.sh
          bash -n simplebuild/qemu-test.sh
          python3 -m py_compile simplebuild/build.py

      - name: Configure host-side SimpleBuild
        shell: bash
        run: printf 'PODMAN_BUILD?=1\nPREFIX_BINARY=0\n' > build/.config

      - name: Check SimpleBuild prerequisites
        shell: bash
        run: bash simplebuild/build.sh --arch x86_64 --config desktop --check

      - name: Generate harddrive.img and redox-live.iso with SimpleBuild
        id: simplebuild
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          bash simplebuild/build.sh --arch x86_64 --config desktop --no-rebuild-changed --force
          elapsed=$((SECONDS - started))
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          echo "SimpleBuild elapsed seconds: $elapsed"
          {
            echo "### SimpleBuild build timing"
            echo
            echo "- Fresh image-generation time (output-image cache bypassed): ${elapsed}s ($((elapsed / 60))m $((elapsed % 60))s)"
            echo "- Compiled installer/repository prerequisites: restored from checksum-verified cache"
            if (( elapsed <= 1800 )); then
              echo "- 30-minute target: **MET**"
            else
              echo "- 30-minute target: **NOT MET**"
              echo "- Over target by: $((elapsed - 1800))s"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > 1800 )); then
            echo "::warning::The 30-minute target was exceeded: ${elapsed}s"
          fi

      - name: Verify generated image checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build/build/x86_64/desktop
          test -s harddrive.img
          test -s redox-live.iso
          sha256sum -c SHA256SUMS

      - name: Boot-test both generated images directly in QEMU
        shell: bash
        run: |
          set -euo pipefail
          bash simplebuild/qemu-test.sh \\
            build/build/x86_64/desktop/harddrive.img \\
            build/build/x86_64/desktop/redox-live.iso

      - name: Save generated images for subsequent runs
        uses: actions/cache/save@v4
        with:
          path: |
            build/build/x86_64/desktop
            build/simplebuild/cache/x86_64
          key: simplebuild-images-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'simplebuild/**', 'Cargo.lock', '**/Cargo.lock') }}

      - name: Upload SimpleBuild image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trion-simplebuild-x86_64-desktop
          path: |
            build/build/x86_64/desktop/harddrive.img
            build/build/x86_64/desktop/redox-live.iso
            build/build/x86_64/desktop/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
