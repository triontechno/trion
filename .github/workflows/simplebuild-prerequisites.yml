name: Prepare SimpleBuild Prerequisites

# One-time / refresh workflow. The full Cookbook build is intentionally isolated
# here; SimpleBuild image CI never invokes it.
on:
  workflow_call:
    outputs:
      cache_key:
        description: Exact prerequisite cache key created or restored by this workflow.
        value: ${{ jobs.prepare.outputs.cache_key }}
      prefix_binary:
        description: Whether the verified Redox prefix uses prebuilt binary archives.
        value: ${{ jobs.prepare.outputs.prefix_binary }}
      archive_sha256:
        description: Fingerprint of the verified prefix mode and archive manifest.
        value: ${{ jobs.prepare.outputs.archive_sha256 }}
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build/Makefile"
      - "build/mk/**"
      - "build/podman/**"
      - "build/podman_bootstrap.sh"
      - "build/recipes/**"
      - "build/config/**"
      - "build/redox.ipxe"
      - "config/**"
      - "filesystem/**"
      - "kernel/**"
      - "src/**"
      - "ternary/**"
      - "recipes/**"
      - "podman/**"
      - "cookbook.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "simplebuild/**"
      - ".github/workflows/simplebuild-prerequisites.yml"
permissions:
  contents: read

concurrency:
  group: simplebuild-prerequisites-pr-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Compile reusable installer and package repository
    outputs:
      cache_key: ${{ steps.prerequisite-key.outputs.key }}
      toolchain_key: ${{ steps.prerequisite-key.outputs.toolchain_key }}
      prefix_binary: ${{ steps.prefix-archives.outputs.prefix_binary }}
      archive_sha256: ${{ steps.prefix-archives.outputs.archive_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and fingerprint official Redox prebuilt toolchains
        id: prefix-archives
        shell: bash
        run: bash simplebuild/fetch-prefix.sh

      - name: Compute stable prerequisite cache key
        id: prerequisite-key
        shell: bash
        run: bash simplebuild/prerequisite-key.sh

      - name: Restore any existing compiled prerequisites
        id: prerequisite-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/prefix
            build/target
            build/build/fstools.tag
            build/recipes/core/relibc/source
            build/build/**/repo.tag
            build/simplebuild/prefix-archives.sha256
            build/simplebuild/prefix-mode
            build/repo
            build/fstools
            build/fstools-target
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          key: ${{ steps.prerequisite-key.outputs.key }}

      - name: Restore the compiled Redox toolchain and sysroot
        id: toolchain-cache
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/prefix
            build/target
            build/build/fstools.tag
            build/recipes/core/relibc/source
          key: ${{ steps.prerequisite-key.outputs.toolchain_key }}

      - name: Install Rust
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify downloaded or restored Redox prefix archives
        shell: bash
        run: |
          set -euo pipefail
          mode="$(cat build/simplebuild/prefix-mode)"
          if [[ "$mode" == "binary" ]]; then
            (cd build && sha256sum -c simplebuild/prefix-archives.sha256)
          elif [[ "$mode" == "source" ]]; then
            test ! -s build/simplebuild/prefix-archives.sha256
          else
            echo "Invalid prefix mode: $mode" >&2
            exit 1
          fi
          actual_manifest_sha256="$(printf '%s\n' "$(sha256sum build/simplebuild/prefix-mode | cut -d' ' -f1)" "$(sha256sum build/simplebuild/prefix-archives.sha256 | cut -d' ' -f1)" | sha256sum | cut -d' ' -f1)"
          test "$actual_manifest_sha256" = "${{ steps.prefix-archives.outputs.archive_sha256 }}"

      - name: Install build dependencies
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash build/podman_bootstrap.sh -d

      - name: Configure Cookbook prerequisites build
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: printf 'PODMAN_BUILD?=1\nPREFIX_BINARY=${{ steps.prefix-archives.outputs.prefix_binary }}\n' > build/.config

      - name: Build the Cookbook container
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: make -C build build/container.tag

      - name: Verify the Cookbook src/base mount
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm \
            --volume "$GITHUB_WORKSPACE/build:/mnt/redox:Z" \
            --volume "$GITHUB_WORKSPACE/src:/mnt/redox/src:Z" \
            redox-base \
            bash -e -c 'test -f /mnt/redox/src/base/Makefile'

      # Save the expensive GCC/Rust/Clang/LLVM/sysroot stage before compiling
      # any packages. A failure in the repository stage must never discard the
      # toolchain work, and source-only changes reuse this cache.
      - name: Build the Redox toolchain and sysroot
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.prerequisite-key.outputs.target }}"
          if [[ -d "build/prefix/$target/sysroot" ]]; then
            echo "Restored the compiled Redox toolchain and sysroot from cache."
          else
            started=$SECONDS
            make -C build prefix
            echo "Redox toolchain build elapsed seconds: $((SECONDS - started))"
          fi
          test -d "build/prefix/$target/sysroot"

      - name: Save the compiled Redox toolchain and sysroot
        if: steps.prerequisite-cache.outputs.cache-hit != 'true' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/prefix
            build/target
            build/build/fstools.tag
            build/recipes/core/relibc/source
          key: ${{ steps.prerequisite-key.outputs.toolchain_key }}

      - name: Build compiled package repository and host installer
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          make -C build repo fstools
          elapsed=$((SECONDS - started))
          echo "Prerequisite preparation elapsed seconds: $elapsed"
          echo "The 60-second target is measured by the artifact-first SimpleBuild image workflow, not this isolated preparation workflow."
          test -x build/fstools/bin/redox_installer
          test -d build/repo
          test -n "$(find build/repo -type f -print -quit)"
          test -d "build/prefix/${{ steps.prerequisite-key.outputs.target }}/sysroot"
          actual_relibc_revision="$(git -C build/recipes/core/relibc/source rev-parse HEAD)"
          expected_relibc_revision="${{ steps.prerequisite-key.outputs.relibc_revision }}"
          test "$actual_relibc_revision" = "$expected_relibc_revision"
          if [[ -d build/recipes/dev/llvm21/source/.git ]]; then
            actual_llvm_revision="$(git -C build/recipes/dev/llvm21/source rev-parse HEAD)"
            expected_llvm_revision="${{ steps.prerequisite-key.outputs.llvm_revision }}"
            test "$actual_llvm_revision" = "$expected_llvm_revision"
          fi

      - name: Verify LLVM 21 toolchain inside Debian Trixie
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm --workdir /mnt/redox \
            --volume "$GITHUB_WORKSPACE/build:/mnt/redox:Z" \
            --volume "$GITHUB_WORKSPACE/src:/mnt/redox/src:Z" \
            --volume "$GITHUB_WORKSPACE/ternary:/mnt/redox/ternary:Z" \
            --volume "$GITHUB_WORKSPACE/build/podman:/root:Z" \
            --env TARGET=x86_64-unknown-redox \
            --env GNU_TARGET=x86_64-unknown-redox \
            redox-base bash -euc '
              prefix="/mnt/redox/prefix/$TARGET"
              export PATH="$prefix/clang-install/bin:$prefix/gcc-install/bin:$prefix/rust-install/bin:$PATH"
              clang --version
              lld_version="$(ld.lld --version)"
              echo "$lld_version"
              lld_major="$(printf '%s\n' "$lld_version" | sed -n "s/^LLD \\([0-9][0-9]*\\).*/\\1/p")"
              test "$lld_major" = 21
              llvm-config --version
              test "$(llvm-config --version | cut -d. -f1)" = 21
              clang_major="$(clang --version | sed -n "s/.*version \\([0-9][0-9]*\\).*/\\1/p" | head -n1)"
              test "$clang_major" = 21
              test -d "$prefix/sysroot"
              test -x "$prefix/gcc-install/bin/x86_64-unknown-redox-gcc"
            '

      - name: Package and checksum reusable prerequisites
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/simplebuild/cache
          tar -czf build/simplebuild/cache/repo_archive.tar.gz -C build/repo .
          (
            cd build
            sha256sum fstools/bin/redox_installer \
              simplebuild/cache/repo_archive.tar.gz \
              > simplebuild/prerequisites.sha256
          )
          (cd build && sha256sum -c simplebuild/prerequisites.sha256)
          tar -tzf build/simplebuild/cache/repo_archive.tar.gz >/dev/null

      - name: Save reusable compiled prerequisites
        if: steps.prerequisite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/prefix
            build/target
            build/build/fstools.tag
            build/recipes/core/relibc/source
            build/build/**/repo.tag
            build/simplebuild/prefix-archives.sha256
            build/simplebuild/prefix-mode
            build/repo
            build/fstools
            build/fstools-target
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          key: ${{ steps.prerequisite-key.outputs.key }}

      - name: Verify restored or freshly built prerequisite bundle
        shell: bash
        run: |
          set -euo pipefail
          test -x build/fstools/bin/redox_installer
          test -d "build/prefix/${{ steps.prerequisite-key.outputs.target }}/sysroot"
          test -d build/repo
          test -n "$(find build/repo -type f -print -quit)"
          test -s build/simplebuild/cache/repo_archive.tar.gz
          test -s build/simplebuild/prerequisites.sha256
          (cd build && sha256sum -c simplebuild/prerequisites.sha256)
          tar -tzf build/simplebuild/cache/repo_archive.tar.gz >/dev/null
          actual_relibc_revision="$(git -C build/recipes/core/relibc/source rev-parse HEAD)"
          test "$actual_relibc_revision" = "${{ steps.prerequisite-key.outputs.relibc_revision }}"

      - name: Publish reusable prerequisite bundle
        uses: actions/upload-artifact@v4
        with:
          name: trion-simplebuild-prerequisites
          path: |
            build/fstools/bin/redox_installer
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
