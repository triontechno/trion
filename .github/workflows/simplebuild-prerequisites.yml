name: Prepare SimpleBuild Prerequisites

# One-time / refresh workflow. The full Cookbook build is intentionally isolated
# here; SimpleBuild image CI never invokes it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simplebuild-prerequisites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Compile reusable installer and package repository
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore any existing compiled prerequisites
        uses: actions/cache/restore@v4
        with:
          path: |
            build/build/podman
            build/prefix
            build/repo
            build/fstools
            build/fstools-target
            build/fstools.tag
            build/target
            build/recipes/**/target
          key: simplebuild-prerequisites-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'Cargo.lock', '**/Cargo.lock') }}
          restore-keys: |
            simplebuild-prerequisites-${{ runner.os }}-
            phase2-images-${{ runner.os }}-

      - name: Install build dependencies
        shell: bash
        run: bash build/podman_bootstrap.sh -d

      - name: Configure traditional Cookbook prerequisites build
        shell: bash
        run: printf 'PODMAN_BUILD?=1\nPREFIX_BINARY=0\n' > build/.config

      - name: Build the Cookbook container
        shell: bash
        run: make -C build build/container.tag

      - name: Verify the Cookbook src/base mount
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm \
            --volume "$GITHUB_WORKSPACE/build:/mnt/redox:Z" \
            --volume "$GITHUB_WORKSPACE/src:/mnt/redox/src:Z" \
            redox-base \
            bash -e -c 'test -f /mnt/redox/src/base/Makefile'

      - name: Build compiled package repository and host installer
        shell: bash
        run: |
          set -euo pipefail
          make -C build repo fstools
          test -x build/fstools/bin/redox_installer
          test -d build/repo
          test -n "$(find build/repo -type f -print -quit)"

      - name: Package and checksum reusable prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/simplebuild/cache
          tar -czf build/simplebuild/cache/repo_archive.tar.gz -C build/repo .
          (
            cd build
            sha256sum fstools/bin/redox_installer \
              simplebuild/cache/repo_archive.tar.gz \
              > simplebuild/prerequisites.sha256
          )
          (cd build && sha256sum -c simplebuild/prerequisites.sha256)
          tar -tzf build/simplebuild/cache/repo_archive.tar.gz >/dev/null

      - name: Save reusable compiled prerequisites
        uses: actions/cache/save@v4
        with:
          path: |
            build/build/podman
            build/prefix
            build/repo
            build/fstools
            build/fstools-target
            build/fstools.tag
            build/target
            build/recipes/**/target
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          key: simplebuild-prerequisites-${{ runner.os }}-${{ hashFiles('build/**', 'config/**', 'filesystem/**', 'kernel/**', 'src/**', 'simplebuild/**', 'Cargo.lock', '**/Cargo.lock') }}

      - name: Publish reusable prerequisite bundle
        uses: actions/upload-artifact@v4
        with:
          name: trion-simplebuild-prerequisites
          path: |
            build/fstools/bin/redox_installer
            build/simplebuild/cache/repo_archive.tar.gz
            build/simplebuild/prerequisites.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
