name: Trion binary translator frontend

on:
  push:
    branches: [main]
    paths:
      - "ternary/translator/**"
      - "ternary/core/**"
      - "ternary/runtime/**"
      - "ternary/executable/**"
      - ".github/workflows/translator.yml"
  pull_request:
    branches: [main]
    paths:
      - "ternary/translator/**"
      - "ternary/core/**"
      - ".github/workflows/translator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ternary/translator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run formatter
        run: cargo fmt --all -- --check
      - name: Check translator
        run: cargo check --all-targets
      - name: Test translator frontend
        run: cargo test --all-targets
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
