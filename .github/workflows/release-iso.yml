name: TRION ISO Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (format: 1.x.xx, for example 1.0.01)"
        required: true
        type: string
      build_run_id:
        description: "Successful SimpleBuild Image Build workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish ISO release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^1\.[0-9]+\.[0-9]{2}$ ]]; then
            echo "Version must match 1.x.xx (for example, 1.0.01)."
            exit 1
          fi

      - name: Verify source build run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          run="$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,status,conclusion)"
          workflow="$(jq -r '.workflowName' <<< "$run")"
          status="$(jq -r '.status' <<< "$run")"
          conclusion="$(jq -r '.conclusion' <<< "$run")"
          if [[ "$workflow" != "TRION Image Build" || "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "The supplied run must be a successfully completed SimpleBuild Image Build."
            exit 1
          fi

      - name: Download image build artifacts
        uses: actions/download-artifact@v4
        with:
          name: trion-images
          path: release-assets
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Verify ISO artifact
        run: test -s release-assets/redox-live.iso

      - name: Publish ISO as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TRION v${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/redox-live.iso
        env:
          GITHUB_TOKEN: ${{ github.token }}
