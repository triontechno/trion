name: Vendor TRION core sources

on:
  push:
    branches:
      - feat/trion-monorepo-foundation
    paths:
      - "scripts/import-core-sources.sh"
      - ".github/workflows/vendor-core-sources.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/trion-monorepo-foundation
          fetch-depth: 1
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Import upstream source trees
        run: bash scripts/import-core-sources.sh
      - name: Commit vendored sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Vendor first-party Redox and COSMIC sources [skip ci]"
          git push origin HEAD:feat/trion-monorepo-foundation
