[package]
name = "bootstrap"
description = "Userspace bootstrapper"
version = "0.0.0"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
edition = "2024"
license = "MIT"

[dependencies]
hashbrown = { version = "0.15", default-features = false, features = [
    "inline-more",
    "default-hasher",
] }
linked_list_allocator = "0.10"
libredox = { version = "0.1.25", default-features = false, features = ["protocol"] }
log = { version = "0.4", default-features = false }
plain = "0.2"
redox-initfs = { path = "../initfs", default-features = false }
redox_syscall = "0.9.5"
redox-scheme = { version = "0.12.0", default-features = false }
redox-path = "0.4.0"
slab = { version = "0.4.9", default-features = false }
arrayvec = { version = "0.7.6", default-features = false }

[target.'cfg(target_os = "redox")'.dependencies]
# TRION extends redox-rt with native-image execution and guest capability FDs,
# so bootstrap must use the monorepo's local runtime instead of upstream relibc.
redox-rt = { path = "../../relibc/redox-rt", default-features = false }

[lints.clippy]
perf = { level = "deny", priority = -1 }

[profile.release]
panic = "abort"
lto = "fat"
opt-level = "s"

[profile.dev]
panic = "abort"
opt-level = "s"

[patch.crates-io]
# ContextStatus::GuestFault/GuestExit and the native-exception ABI are local
# kernel changes, so Redox userspace must resolve against the local syscall crate.
redox_syscall = { path = "../../kernel/syscall" }
